<!doctype html>

<style>

  .bg { position: absolute; inset: 0;

  .vignette { position: absolute; inset: 0; background: radial-gradient(80% 80% at 50% 50%, transparent 55%, rgba(7,11,16,.8)); }

  .mark { width: 44px; height: 44px; color: #5cc8ff; }
  .copy { position: absolute; left: 72px; top: 140px; width: 720px; }
  .line { font-size: 34px; font-weight: 500; color: #c3d0db; line-height: 1.35; display: flex; gap: 16px; align-items: baseline; }
  .line i { font-style: normal; font-family: "IBM Plex Mono", monospace; color: #5cc8ff; font-size: 26px; }
  .rule { height: 2px; width: 420px; margin: 22px 0 16px; background: linear-gradient(90deg, #5cc8ff, rgba(92,200,255,0)); }
  .result { font-size: 84px; font-weight: 800; color: #5cc8ff; letter-spacing: -.035em; line-height: 1; white-space: nowrap; text-shadow: 0 0 60px rgba(92,200,255,.35); }
  .foot { position: absolute; bottom: 56px; left: 72px; font-size: 22px; color: #b9c6d2; font-weight: 300; }
  .tag { position: absolute; top: 66px; right: 72px; font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: .16em; color: #8b9aaa; }
  .radar { position: absolute; right: 48px; top: 120px; width: 340px; height: 340px; opacity: .9; }
  .radar circle, .radar path { fill: none; stroke: #5cc8ff; stroke-width: 1.2; }
  .sweep { fill: url(#g) !important; stroke: none !important; }
</style>
</head>
